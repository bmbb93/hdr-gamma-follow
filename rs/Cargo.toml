[package]
name = "hdr-gamma-follow"
version = "0.1.0"
edition = "2024"
description = "Windows HDR: SDR 明るさに追従して sRGB→Gamma (2.2/2.4/2.6) MHC2 プロファイルを切り替える常駐ツール"

[dependencies]
md-5 = "0.10"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_ColorSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
